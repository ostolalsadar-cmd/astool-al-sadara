<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>أسطول الصدارة | تأجير السيارات</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#050505}
body{font-family:Arial,Tahoma,sans-serif;display:flex;justify-content:center}
.page{
  position:relative;width:100%;max-width:1024px;
  min-height:100vh;overflow:hidden;
  background:#050505 url("background.png") center top/100% auto no-repeat;
  aspect-ratio:1024/1536;
}
.hotspot{
  position:absolute;display:block;z-index:5;
  border-radius:30px;
  background:transparent;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
.google{left:6.5%;top:73.2%;width:29%;height:7.2%}
.snap{left:36.5%;top:73.2%;width:29%;height:7.2%}
.tiktok{left:67%;top:73.2%;width:29%;height:7.2%}
@media (max-width:700px){
  .page{min-height:100vh;aspect-ratio:auto;background-size:100% auto;background-position:center top}
  .hotspot{height:6.2%}
  .google{top:76.0%}
  .snap{top:76.0%}
  .tiktok{top:76.0%}
}
</style>
</head>
<body>
<main class="page" aria-label="أسطول الصدارة لتأجير السيارات">
  <a class="hotspot google" href="https://maps.app.goo.gl/4sBrP4ADqBgGpTX79" target="_blank" rel="noopener" aria-label="تقييمنا على Google"></a>
  <a class="hotspot snap" href="https://snapchat.com/t/0SjLI67K" target="_blank" rel="noopener" aria-label="تابعنا على Snapchat"></a>
  <a class="hotspot tiktok" href="https://www.tiktok.com/@masqat22" target="_blank" rel="noopener" aria-label="تابعنا على TikTok"></a>
</main>
</body>
</html>
